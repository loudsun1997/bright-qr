name: Publish signed APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRIGHT_QR_KEYSTORE_BASE64: ${{ secrets.BRIGHT_QR_KEYSTORE_BASE64 }}
      BRIGHT_QR_STORE_PASSWORD: ${{ secrets.BRIGHT_QR_STORE_PASSWORD }}
      BRIGHT_QR_KEY_ALIAS: ${{ secrets.BRIGHT_QR_KEY_ALIAS }}
      BRIGHT_QR_KEY_PASSWORD: ${{ secrets.BRIGHT_QR_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Validate release tag and secrets
        shell: bash
        run: |
          set -euo pipefail
          app_version=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle)
          if ! git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null; then
            echo "Release tag ${RELEASE_TAG} does not exist." >&2
            exit 1
          fi
          if [[ "${RELEASE_TAG}" != "v${app_version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match app version v${app_version}." >&2
            exit 1
          fi
          for variable in \
            BRIGHT_QR_KEYSTORE_BASE64 \
            BRIGHT_QR_STORE_PASSWORD \
            BRIGHT_QR_KEY_ALIAS \
            BRIGHT_QR_KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "Required GitHub Actions secret ${variable} is missing." >&2
              exit 1
            fi
          done

      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          keystore_path="${RUNNER_TEMP}/bright-qr-release.jks"
          printf '%s' "${BRIGHT_QR_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          chmod 600 "${keystore_path}"
          echo "BRIGHT_QR_KEYSTORE_PATH=${keystore_path}" >> "${GITHUB_ENV}"

      - name: Test, lint, and build signed release APK
        run: ./gradlew --no-daemon test lintRelease assembleRelease

      - name: Verify signature and prepare assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/bright-qr.apk
          apksigner_path=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [[ -z "${apksigner_path}" ]]; then
            echo "apksigner was not found in the Android SDK." >&2
            exit 1
          fi
          verification_output=$("${apksigner_path}" verify --verbose --print-certs dist/bright-qr.apk)
          printf '%s\n' "${verification_output}"
          actual_fingerprint=$(printf '%s\n' "${verification_output}" \
            | awk '/certificate SHA-256 digest:/ { print $NF; exit }')
          if [[ -z "${actual_fingerprint}" ]]; then
            echo "Could not read the release certificate fingerprint." >&2
            exit 1
          fi
          expected_fingerprint=$(tr -d '[:space:]' < docs/release-certificate-sha256.txt)
          if [[ "${actual_fingerprint}" != "${expected_fingerprint}" ]]; then
            echo "Release certificate fingerprint does not match the project identity." >&2
            exit 1
          fi
          (cd dist && sha256sum bright-qr.apk > bright-qr.apk.sha256)

      - name: Create GitHub Release
        shell: bash
        run: |
          gh release create "${RELEASE_TAG}" \
            dist/bright-qr.apk \
            dist/bright-qr.apk.sha256 \
            --title "Bright QR ${RELEASE_TAG}" \
            --generate-notes \
            --verify-tag
