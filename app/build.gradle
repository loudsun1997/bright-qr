plugins {
    id "com.android.application"
}

def releaseSigningEnvironment = [
        storeFile    : System.getenv("BRIGHT_QR_KEYSTORE_PATH"),
        storePassword: System.getenv("BRIGHT_QR_STORE_PASSWORD"),
        keyAlias     : System.getenv("BRIGHT_QR_KEY_ALIAS"),
        keyPassword  : System.getenv("BRIGHT_QR_KEY_PASSWORD")
]
def hasAnyReleaseSigningValue = releaseSigningEnvironment.values().any { it }
def hasCompleteReleaseSigning = releaseSigningEnvironment.values().every { it }

if (hasAnyReleaseSigningValue && !hasCompleteReleaseSigning) {
    throw new GradleException(
            "Release signing is partially configured. Set all BRIGHT_QR_* signing variables."
    )
}

android {
    namespace "dev.brightqr"
    compileSdk 35

    defaultConfig {
        applicationId "dev.brightqr"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasCompleteReleaseSigning) {
                storeFile file(releaseSigningEnvironment.storeFile)
                storePassword releaseSigningEnvironment.storePassword
                keyAlias releaseSigningEnvironment.keyAlias
                keyPassword releaseSigningEnvironment.keyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasCompleteReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation "com.google.zxing:core:3.5.3"

    testImplementation "junit:junit:4.13.2"
}
